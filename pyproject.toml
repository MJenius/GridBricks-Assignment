[project]
name = "wind-desk"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "tzdata==2025.2",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python build.py"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]
